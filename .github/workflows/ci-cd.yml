# ==============================================================================
# Cosmos CI/CD Pipeline
# ------------------------------------------------------------------------------

name: Cosmos CI/CD

# Disparadores: Pushes y Pull Requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref, excepto deploys en main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint y Verificación de Formato (Biome)
  # ----------------------------------------------------------------------------
  lint:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Verifica lint, formato y orden de imports sin modificar archivos
      - name: Lint & Format Check con Biome
        run: bunx biome ci .

  # ----------------------------------------------------------------------------
  # Job 2: Pruebas Unitarias (Vitest + Testing Library)
  # ----------------------------------------------------------------------------
  unit:
    name: Tests Unitarios (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Ejecuta la suite completa de unit tests (Zustand, hooks, componentes)
      - name: Tests unitarios
        run: bun run test:unit

  # ----------------------------------------------------------------------------
  # Job 3: Pruebas End-to-End (Playwright)
  # ----------------------------------------------------------------------------
  e2e:
    name: Suite E2E (Playwright)
    # Deshabilitado: las specs están obsoletas tras el rediseño de la galería y del sistema solar
    if: false
    needs: [lint, unit] # Se ejecuta solo si lint y unit pasaron con éxito
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Bun, dependencias y binarios de Playwright Chromium
      - name: Setup E2E
        uses: ./.github/actions/setup-e2e

      # 3. Ejecuta la suite completa de pruebas End-to-End en Chromium
      - name: Suite E2E (Playwright)
        run: bun run test:e2e

      # 4. Guarda reportes, trazas y capturas de pantalla solo si algún test falló
      - name: Subir resultados E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # 5. Almacena la carpeta dist compilada durante los tests para reutilizarla en deploy
      - name: Subir dist para deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-e2e
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Job 4: Despliegue en Cloudflare Pages
  # ----------------------------------------------------------------------------
  deploy:
    name: Despliegue en Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, unit] # Requiere lint y tests; E2E está desactivado temporalmente
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. Clona el código
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura el entorno Bun
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Descarga el build precompilado generado en el paso de E2E
      - name: Bajar dist desde e2e (artifact)
        uses: actions/download-artifact@v4
        with:
          name: dist-e2e
          path: dist/
        continue-on-error: true

      # 4. Compila nuevamente solo en caso de que el artefacto no estuviera disponible
      - name: Build de respaldo (si no hay dist de artifact)
        run: |
          if [ -d dist ] && [ -f dist/index.html ]; then
            echo "dist restaurado desde artifact e2e, omitiendo build"
          else
            bun run build
          fi

      # 5. Publica en Cloudflare Pages usando Wrangler Action
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist/ --project-name=cosmos --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
