# Action compuesta para inicializar el entorno base de Node.js y Bun con caché de dependencias
name: Setup Bun env
description: Configura Node, Bun, caché de node_modules e instala dependencias con Bun

inputs:
  bun-version:
    description: Versión de Bun a utilizar
    required: false
    default: "1.4.4"
  node-version:
    description: Versión de Node.js a utilizar
    required: false
    default: "24.22.1"

runs:
  using: composite
  steps:
    # 1. Configura el runtime de Node.js requerido por ciertas herramientas de build
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    # 2. Configura el runtime oficial de Bun
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # 3. Restaura la caché de node_modules usando el hash de bun.lock para acelerar el pipeline
    - name: Cache node_modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    # 4. Instala dependencias del proyecto de forma determinista
    - name: Install dependencies
      shell: bash
      run: bun install
