# ==============================================================================
# Cosmos CI/CD Pipeline
# ------------------------------------------------------------------------------

name: Cosmos CI/CD

# Disparadores: Pushes y Pull Requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint y Verificación de Formato (Biome)
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Ejecuta el linter de Biome
      - name: Lint con Biome
        run: bun run lint

      # 4. Verifica que no existan discrepancias de formato
      - name: Format check con Biome
        run: bun run check

  # ----------------------------------------------------------------------------
  # Job 2: Pruebas Unitarias (Vitest + Testing Library)
  # ----------------------------------------------------------------------------
  unit:
    name: Tests Unitarios (Vitest)
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Ejecuta la suite completa de unit tests (Zustand, hooks, componentes)
      - name: Tests unitarios
        run: bun run test:unit

  # ----------------------------------------------------------------------------
  # Job 3: Pruebas End-to-End (Playwright)
  # ----------------------------------------------------------------------------
  e2e:
    name: Suite E2E (Playwright)
    needs: [lint, unit] # Se ejecuta solo si lint y unit pasaron con éxito
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura Bun, dependencias y binarios de Playwright Chromium
      - name: Setup E2E
        uses: ./.github/actions/setup-e2e

      # 3. Ejecuta la suite completa de pruebas End-to-End en Chromium
      - name: Suite E2E (Playwright)
        run: bun run test:e2e

      # 4. Guarda reportes, trazas y capturas de pantalla solo si algún test falló
      - name: Subir resultados E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # 5. Almacena la carpeta dist compilada durante los tests para reutilizarla en deploy
      - name: Subir dist para deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-e2e
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Job 4: Despliegue en Cloudflare Pages
  # ----------------------------------------------------------------------------
  deploy:
    name: Despliegue en Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, unit, e2e] # Requiere que todos los jobs previos hayan sido exitosos
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura el entorno Bun
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Descarga el build precompilado generado en el paso de E2E
      - name: Bajar dist desde e2e (artifact)
        uses: actions/download-artifact@v4
        with:
          name: dist-e2e
          path: dist/
        continue-on-error: true

      # 4. Compila nuevamente solo en caso de que el artefacto no estuviera disponible
      - name: Build de respaldo (si no hay dist de artifact)
        run: |
          if [ -d dist ] && [ -f dist/index.html ]; then
            echo "dist restaurado desde artifact e2e, omitiendo build"
          else
            bun run build
          fi

      # 5. Publica en Cloudflare Pages usando Wrangler Action
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=cosmos
